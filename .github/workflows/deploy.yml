name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main # Garante que só seja executado no branch principal

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Configura Node.js (Ambiente necessário)
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 2. Instala dependências e compila
      - name: Install dependencies and Build
        run: |
          npm install
          npm run build
          
      # 3. Faz o deploy da pasta 'dist' para o GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist # O diretório final compilado
          force_orphan: true
          cname: ''
