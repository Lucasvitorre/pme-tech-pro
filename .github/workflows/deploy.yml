name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main # O nome do seu branch principal

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Configura o ambiente Node.js (necessário para npm)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use uma versão LTS estável

      # 2. Instala as dependências (npm install)
      - name: Install Dependencies
        run: npm install

      # 3. Compila o projeto (npm run build)
      - name: Build Project
        run: npm run build

      # 4. Publica o conteúdo da pasta 'dist' no GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist # O diretório de saída que o Vite cria
          force_orphan: true
          cname: '' # Remova o CNAME se não estiver usando domínio customizado
